<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NYC hotels — distance from the Javits Center</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#eceff3; --panel:#ffffff; --sunk:#e3e8ee; --ink:#151a21; --mid:#4b5665; --soft:#6f7b8a;
    --rule:#d3dae2; --accent:#2f4d8c; --javits:#5b3fa8;
    --t1:#127a5f; --t2:#9a7409; --t3:#c05a12; --t4:#b32d24;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0e1216; --panel:#161b22; --sunk:#1c222b; --ink:#e5eaf1; --mid:#a5b0bd; --soft:#8a95a3;
    --rule:#262d38; --accent:#7d9ce0; --javits:#a892ec;
    --t1:#3fb894; --t2:#d9b23a; --t3:#e8873c; --t4:#e0655a;
  }}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 460px;grid-template-rows:auto minmax(0,1fr);height:100vh}
  header{grid-column:1/-1;background:var(--panel);border-bottom:1px solid var(--rule);padding:16px 22px;display:flex;align-items:baseline;gap:20px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--mid);font-size:13.5px}
  .legend{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--mid)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:11px;height:11px;border-radius:50%;display:inline-block}

  #map{width:100%;height:100%;background:var(--sunk)}

  aside{background:var(--panel);border-left:1px solid var(--rule);overflow-y:auto}
  .ctl{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--rule);padding:12px 18px;display:flex;gap:8px;align-items:center;z-index:5}
  .ctl b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:500;margin-right:auto}
  button{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px 11px;border-radius:4px;border:1px solid var(--rule);background:var(--sunk);color:var(--mid);cursor:pointer}
  button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  ol{list-style:none;margin:0;padding:0}
  li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;padding:13px 18px;border-bottom:1px solid var(--rule);cursor:pointer;align-items:start}
  li:hover,li.on{background:var(--sunk)}
  .rank{font-family:var(--mono);font-size:12px;color:var(--soft);padding-top:3px;font-variant-numeric:tabular-nums}
  .nm{font-weight:600;font-size:14.5px;line-height:1.3}
  .meta{color:var(--mid);font-size:12.5px;margin-top:3px}
  .meta em{font-style:normal;color:var(--soft)}
  .rt{text-align:right;white-space:nowrap}
  .tot{font-family:var(--mono);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
  .ngt{font-family:var(--mono);font-size:11.5px;color:var(--soft);font-variant-numeric:tabular-nums}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
  .warn{font-family:var(--mono);font-size:11px;color:var(--t3);margin-top:3px}

  .leaflet-popup-content{font-family:var(--sans);font-size:13px;margin:12px 14px}
  .leaflet-popup-content b{font-size:14px}
  .pp{font-family:var(--mono);font-variant-numeric:tabular-nums}

  @media (max-width:1000px){
    .wrap{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 52vh minmax(0,1fr)}
    aside{border-left:0;border-top:1px solid var(--rule)}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NYC hotels — distance from the Javits Center</h1>
    <span class="sub">4 nights · refundable, standard/deluxe · straight-line distance</span>
    <div class="legend">
      <span><i class="sw" style="background:var(--javits)"></i>Javits</span>
      <span><i class="sw" style="background:var(--t1)"></i>under $2k</span>
      <span><i class="sw" style="background:var(--t2)"></i>$2–3k</span>
      <span><i class="sw" style="background:var(--t3)"></i>$3–4k</span>
      <span><i class="sw" style="background:var(--t4)"></i>over $4k</span>
    </div>
  </header>
  <div id="map"></div>
  <aside>
    <div class="ctl">
      <b>Sort</b>
      <button id="bd" aria-pressed="true">Distance</button>
      <button id="bp" aria-pressed="false">Price</button>
    </div>
    <ol id="list"></ol>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const D = {"javits": {"name": "Jacob K. Javits Convention Center", "lat": 40.7583595, "lon": -74.0021206}, "hotels": [{"name": "Courtyard Midtown West", "lat": 40.7546901, "lon": -73.9986506, "low": 873.67, "total": 3494.68, "hiNight": 942.27, "hiTotal": 3769.08, "rooms": "10+", "type": "Standard", "note": "Member Flexible Rate; accessible options", "mi": 0.31, "walk": 8}, {"name": "Pendry Manhattan West", "lat": 40.7531622, "lon": -73.9984906, "low": 1525.5, "total": 6102.0, "hiNight": 1868.0, "hiTotal": 7472.0, "rooms": "10+", "type": "Deluxe room", "note": "BCD Travel (WiFi incl.); deluxe + studio rooms", "mi": 0.41, "walk": 10}, {"name": "Courtyard Manhattan/Times Sq", "lat": 40.7536218, "lon": -73.9861665, "low": 395.0, "total": 1580.0, "hiNight": 464.0, "hiTotal": 1856.0, "rooms": "10+", "type": "Guest room", "note": "Long Term Stay/Rate, Member Retail; accessible + queen options", "mi": 0.9, "walk": 22}, {"name": "The Maritime Hotel", "lat": 40.7424358, "lon": -74.003867, "low": 532.31, "total": 2129.24, "hiNight": 626.25, "hiTotal": 2505.0, "rooms": "10+", "type": "Standard/Accessible", "note": "BCD Travel + SMERATE (some incl. breakfast/WiFi)", "mi": 1.1, "walk": 28}, {"name": "The Standard High Line", "lat": 40.7408533, "lon": -74.0080841, "low": 753.5, "total": 3014.0, "hiNight": 912.0, "hiTotal": 3648.0, "rooms": "10+", "type": "Standard guest room", "note": "Standard Rate; deluxe + premium rooms", "mi": 1.25, "walk": 31}, {"name": "Gansevoort Meatpacking", "lat": 40.7398769, "lon": -74.0057111, "low": 858.6, "total": 3434.4, "hiNight": 966.6, "hiTotal": 3866.4, "rooms": "10+", "type": "Superior room", "note": "BCD BCP; superior + deluxe rooms", "mi": 1.29, "walk": 32}, {"name": "The Manner (Hyatt)", "lat": 40.7270663, "lon": -74.0010162, "low": 858.25, "total": 3433.0, "hiNight": 1212.75, "hiTotal": 4851.0, "rooms": "10+", "type": "Standard", "note": "BCD Travel + Standard Rate; standard + deluxe", "mi": 2.16, "walk": 54}, {"name": "PUBLIC", "lat": 40.7230653, "lon": -73.9920127, "low": 526.5, "total": 2106.0, "hiNight": 672.75, "hiTotal": 2691.0, "rooms": "10+", "type": "Standard", "note": "BCD Travel Hotel Program + Mid Market; double room option", "mi": 2.5, "walk": 62}, {"name": "Sheraton Tribeca", "lat": 40.720878, "lon": -74.004122, "low": 479.0, "total": 1916.0, "hiNight": 559.0, "hiTotal": 2236.0, "rooms": "10+", "type": "Guest room", "note": "Member Retail; superior room option", "mi": 2.59, "walk": 65}, {"name": "Sixty LES", "lat": 40.7218303, "lon": -73.9892736, "low": 403.33, "total": 1613.32, "hiNight": 497.22, "hiTotal": 1988.88, "rooms": "10+", "type": "Studio room", "note": "BCD Travel + Plan Ahead; studio & junior suite", "mi": 2.61, "walk": 65}, {"name": "citizenM New York Bowery", "lat": 40.7205955, "lon": -73.9934478, "low": 450.25, "total": 1801.0, "hiNight": 490.5, "hiTotal": 1962.0, "rooms": "10+", "type": "Guest room", "note": "Stay and Save; accessible, high-floor, premium-view", "mi": 2.65, "walk": 66}, {"name": "Merchant LES Hotel", "lat": 40.7199657, "lon": -73.989397, "low": 594.0, "total": 2376.0, "hiNight": 794.0, "hiTotal": 3176.0, "rooms": "7", "type": "Standard", "note": "Best Available Rate", "mi": 2.74, "walk": 68}, {"name": "Moxy NYC Downtown", "lat": 40.7108496, "lon": -74.0080046, "low": 473.85, "total": 1895.4, "hiNight": 518.85, "hiTotal": 2075.4, "rooms": "10+", "type": "Standard", "note": "Stay 3 and Save non-member; accessible available", "mi": 3.3, "walk": 82}]};
const J = D.javits, H = D.hotels;

const tier = t => t <= 2000 ? 1 : t <= 3000 ? 2 : t <= 4000 ? 3 : 4;
const css  = n => getComputedStyle(document.documentElement).getPropertyValue('--t'+n).trim();
const usd  = n => '$' + n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});

const map = L.map('map',{scrollWheelZoom:true}).setView([40.7385,-73.9985], 13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19
}).addTo(map);

// distance rings from Javits
[0.5,1,2,3].forEach(mi=>{
  L.circle([J.lat,J.lon],{radius:mi*1609.34,color:'#7c8798',weight:1,opacity:.5,
    fill:false,dashArray:'4 6'}).addTo(map)
   .bindTooltip(mi+' mi',{permanent:false,direction:'top'});
});

L.circleMarker([J.lat,J.lon],{radius:13,color:'#fff',weight:3,
  fillColor:getComputedStyle(document.documentElement).getPropertyValue('--javits').trim(),
  fillOpacity:1}).addTo(map)
 .bindPopup('<b>'+J.name+'</b><br>429 11th Ave — the anchor point');

const marks = {};
H.forEach((h,i)=>{
  const m = L.circleMarker([h.lat,h.lon],{radius:9,color:'#fff',weight:2,
    fillColor:css(tier(h.total)),fillOpacity:1}).addTo(map);
  m.bindPopup(
    '<b>'+h.name+'</b><br>'+
    '<span class="pp">'+h.mi.toFixed(2)+' mi · ~'+h.walk+' min walk</span><br><br>'+
    '<span class="pp">'+usd(h.total)+'</span> for 4 nights &nbsp;<span style="color:#777">('+usd(h.low)+'/night)</span><br>'+
    '<span style="color:#777">range '+usd(h.total)+' – '+usd(h.hiTotal)+'</span><br><br>'+
    h.type+' · '+h.rooms+' rooms<br>'+
    '<span style="color:#777">'+h.note+'</span>');
  marks[h.name]=m;
});

const list = document.getElementById('list');
function render(rows){
  list.innerHTML='';
  rows.forEach((h,i)=>{
    const li=document.createElement('li');
    li.innerHTML =
      '<span class="rank">'+(i+1)+'</span>'+
      '<span><span class="nm"><i class="dot" style="background:'+css(tier(h.total))+'"></i>'+h.name+'</span>'+
      '<span class="meta">'+h.mi.toFixed(2)+' mi · ~'+h.walk+' min walk<br><em>'+h.type+' · '+h.rooms+' rooms</em></span>'+
      (h.rooms==='7'?'<span class="warn">only 7 rooms left</span>':'')+'</span>'+
      '<span class="rt"><span class="tot">'+usd(h.total)+'</span><br><span class="ngt">'+usd(h.low)+'/night</span></span>';
    li.onmouseenter=()=>{li.classList.add('on');marks[h.name].setStyle({radius:13})};
    li.onmouseleave=()=>{li.classList.remove('on');marks[h.name].setStyle({radius:9})};
    li.onclick=()=>{map.setView([h.lat,h.lon],15);marks[h.name].openPopup()};
    list.appendChild(li);
  });
}
const bd=document.getElementById('bd'), bp=document.getElementById('bp');
function sort(by){
  bd.setAttribute('aria-pressed', by==='d');
  bp.setAttribute('aria-pressed', by==='p');
  render([...H].sort((a,b)=> by==='d' ? a.mi-b.mi : a.total-b.total));
}
bd.onclick=()=>sort('d'); bp.onclick=()=>sort('p');
sort('d');

map.fitBounds(L.latLngBounds([[J.lat,J.lon],...H.map(h=>[h.lat,h.lon])]).pad(0.12));
</script>
</body>
</html>
